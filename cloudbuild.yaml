steps:
  - id: checks
    name: python:3.14-slim
    entrypoint: bash
    args:
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq --no-install-recommends libatomic1
        pip install -q -r requirements.txt -r requirements-dev.txt
        ruff check .
        pyright

  - id: build
    name: gcr.io/cloud-builders/docker
    args: [build, -t, $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA, .]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [run, deploy, tracker-services, --image, $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA, --region, $_DEPLOY_REGION]

options:
  logging: CLOUD_LOGGING_ONLY

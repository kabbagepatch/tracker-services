[project]
name = "tracker-services"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]~=0.143.0",
    "firebase-admin~=7.7.0",
    "httpx2~=2.16.0",
    "pydantic-settings~=2.16.1",
    "slowapi~=0.1.10",
    "pillow~=12.3.0",
]

[dependency-groups]
dev = [
    "pyright~=1.1.414",
    "ruff~=0.17.1",
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "pytest-watcher>=0.6.3",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv]
package = false

[tool.pytest]
minversion = "9.0"
addopts = [
    "-W", "ignore::DeprecationWarning",
    "--cov=.",
    "--cov-report=html",
    "--cov-report=term",
]

[tool.coverage.run]
omit = [
    "**/__tests__/*",
    "**/__init__.py",
    "./middleware/*",
    "./dependencies/config.py",
    "./dependencies/colorgram.py",
    "./main.py",
    "./firebase.py",
]

[tool.coverage.report]
fail_under = 80

[tool.pyright]
venvPath = "."
venv = ".venv"
reportOptionalOperand = "none"
reportOptionalSubscript = "none"
